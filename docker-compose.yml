name: ak-corebanking-web-standalone

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/api/v1"
    image: ak-corebanking-web:latest
    container_name: ak-corebanking-web
    restart: unless-stopped
    ports:
      - "3080:80"
    networks:
      - ak-banking-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

networks:
  ak-banking-net:
    name: ak-corebanking-network
    external: true
